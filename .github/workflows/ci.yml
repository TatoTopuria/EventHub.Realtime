name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Required repo variable: a CI-reachable EventHub.* NuGet feed (durable BaGetter). See README/CUTOVER.
      EVENTHUB_NUGET_FEED: ${{ vars.EVENTHUB_NUGET_FEED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Build + test
        run: dotnet test Realtime.slnx --configuration Release --logger "console;verbosity=normal"

  image:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Realtime.Service/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/eventhub-realtime:latest
          build-args: |
            EVENTHUB_NUGET_FEED=${{ vars.EVENTHUB_NUGET_FEED }}